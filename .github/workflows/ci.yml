name: CI
permissions:
  actions: read
  contents: read

on:

  push:
    branches: ["main"]
  pull_request:

jobs:
  rust-core:
    name: Rust core (tests, formatting, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path rust/pdftool_core/Cargo.toml -- --check
      - name: Run unit tests
        run: cargo test --manifest-path rust/pdftool_core/Cargo.toml --locked
      - name: Run Clippy
        run: cargo clippy --manifest-path rust/pdftool_core/Cargo.toml --locked --all-targets -- -D warnings

  workflow-lock:
    name: Verify Actions lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install GNU awk
        run: sudo apt-get update && sudo apt-get install -y gawk
      - name: Verify workflow lockfile
        run: ./scripts/check-lock-sync.sh
