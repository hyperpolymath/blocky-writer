# This workflow is managed by gh actions-lock.
name: CI
permissions:
  actions: read
  contents: read

on:

  push:
    branches: ["main"]
  pull_request:

jobs:
  core-fill-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.x

      - uses: dtolnay/rust-toolchain@v1
      - run: deno task test:core-fill

  extension-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.x

      - uses: dtolnay/rust-toolchain@v1
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"

      - run: deno task build:wasm
      - run: deno task build
